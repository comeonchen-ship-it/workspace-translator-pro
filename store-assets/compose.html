<!DOCTYPE html>
<!-- Chrome Web Store images (not shipped). Rendered by store-assets/build.py:
     compose.html?shot=1..5 → 1280×800 screenshots, ?shot=marquee → 1400×560,
     ?shot=tile → 440×280. Panels are the real popup.html in an iframe. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Outfit', -apple-system, "PingFang TC", "Noto Sans JP", sans-serif;
    color: #f5f6fa;
    background:
      radial-gradient(50% 60% at 12% 18%, rgba(108, 92, 231, 0.35), transparent 70%),
      radial-gradient(45% 55% at 92% 88%, rgba(0, 206, 201, 0.22), transparent 70%),
      #0b0c12;
  }
  /* Body copy may contain Vietnamese/CJK, which Outfit lacks. */
  .points, .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans", sans-serif; }
  .canvas { position: relative; width: 100%; height: 100%; display: flex; align-items: center; padding: 0 64px; gap: 48px; }
  .copy { flex: 1; min-width: 0; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #a0a5c0; margin-bottom: 22px; }
  .eyebrow img { width: 36px; height: 36px; border-radius: 9px; }
  h1 { font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -0.5px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #f1c40f, #f39c12 60%, #e67e22); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 18px; font-size: 22px; color: #c7cbe0; line-height: 1.4; max-width: 560px; }
  .points { margin-top: 30px; display: flex; flex-direction: column; gap: 14px; list-style: none; }
  .points li { display: flex; gap: 12px; align-items: flex-start; font-size: 19px; color: #e6e8f2; line-height: 1.35; }
  .points li::before { content: ''; flex-shrink: 0; margin-top: 7px; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #6c5ce7, #00cec9); box-shadow: 0 0 10px rgba(0, 206, 201, 0.6); }

  /* Chrome side-panel frame around the real extension UI */
  .sidepanel {
    width: 384px; height: 712px; flex-shrink: 0; border-radius: 14px; overflow: hidden; background: #f8f9fa;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
    display: flex; flex-direction: column;
  }
  .sidepanel-bar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #202124; font: 500 15px -apple-system, "Segoe UI", sans-serif; background: #f1f3f4; }
  .sidepanel-bar img { width: 18px; height: 18px; border-radius: 4px; }
  .sidepanel iframe { flex: 1; border: 0; width: 100%; background: #0d0e14; }

  /* Before → after document cards (shot 1) */
  .docs { display: flex; align-items: center; gap: 16px; margin-top: 34px; }
  .doc { width: 230px; border-radius: 10px; overflow: hidden; background: #fff; color: #1f2430; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); }
  .doc-head { padding: 10px 12px; background: #1a73e8; color: #fff; font-weight: 700; font-size: 14px; }
  .doc.ja .doc-head { background: #0f9d58; }
  .doc-body { padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .doc-body b { display: block; font-size: 13px; margin-bottom: 4px; }
  .doc-body .row { display: flex; justify-content: space-between; border-top: 1px solid #e6e8ee; padding: 4px 0; }
  .doc-lang { font-size: 11px; font-weight: 700; color: #6b7280; padding: 6px 12px; background: #f3f4f6; }
  .arrow { font-size: 30px; color: #00cec9; font-weight: 700; }

  /* Marquee + tile */
  .marquee { padding: 0 56px; gap: 0; }
  .marquee .copy { flex: 0 0 600px; }
  .marquee h1 { font-size: 56px; }
  .stack { position: relative; flex: 1; height: 100%; }
  .stack .sidepanel { position: absolute; width: 300px; height: 520px; transform-origin: top left; }
  .stack .sidepanel iframe { width: 384px; height: 665px; flex: none; transform: scale(0.78125); transform-origin: top left; }
  .tile { flex-direction: column; justify-content: center; gap: 12px; padding: 0 24px; text-align: center; }
  .tile img { width: 60px; height: 60px; border-radius: 14px; }
  .tile h1 { font-size: 26px; }
  .tile .sub { margin: 0; font-size: 15px; max-width: none; }
  .tile .chips { display: flex; gap: 8px; justify-content: center; }
  .tile .chips span { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const shot = new URLSearchParams(location.search).get('shot') || '1';
const panel = (state, extra = '') => `
  <div class="sidepanel" ${extra}>
    <div class="sidepanel-bar"><img src="../icons/icon48.png" alt="">Workspace Translator Pro</div>
    <iframe src="../_store_panel.html?state=${state}&ui=en"></iframe>
  </div>`;
const eyebrow = `<div class="eyebrow"><img src="../icons/icon128.png" alt="">Workspace Translator Pro</div>`;
const shots = {
  1: `<div class="canvas"><div class="copy">${eyebrow}
        <h1>Translate Google <em>Slides, Docs, Sheets &amp; Forms</em></h1>
        <p class="sub">A translated copy in minutes. Layout and formatting stay; your original is never touched.</p>
        <div class="docs">
          <div class="doc"><div class="doc-lang">ORIGINAL · English</div><div class="doc-head">Q3 Product Roadmap</div>
            <div class="doc-body"><b>Next steps</b><div class="row"><span>Launch beta</span><span>Sep 14</span></div><div class="row"><span>Customer pilots</span><span>Oct 1</span></div><div class="row"><span>General availability</span><span>Jan 31</span></div></div></div>
          <div class="arrow">→</div>
          <div class="doc ja"><div class="doc-lang">COPY · 日本語</div><div class="doc-head">第3四半期 製品ロードマップ</div>
            <div class="doc-body"><b>次のステップ</b><div class="row"><span>ベータ版の公開</span><span>9月14日</span></div><div class="row"><span>顧客パイロット</span><span>10月1日</span></div><div class="row"><span>一般提供開始</span><span>1月31日</span></div></div></div>
        </div></div>${panel('done')}</div>`,
  2: `<div class="canvas"><div class="copy">${eyebrow}
        <h1>Free Gemini key,<br><em>set up in a minute</em></h1>
        <p class="sub">No credit card. Paste the key — it is checked and saved automatically.</p>
        <ul class="points"><li>Natural, fluent AI translation</li><li>Also works with OpenAI, Claude or any OpenAI-compatible endpoint</li><li>Basic free mode available without a key</li></ul>
      </div>${panel('setup')}</div>`,
  3: `<div class="canvas"><div class="copy">${eyebrow}
        <h1>Your names, terms <em>&amp; tone</em></h1>
        <p class="sub">Tell the AI how to handle names once — it recognises them by itself.</p>
        <ul class="points"><li>People, brands and places: translate, keep, or both — 蘋果公司（Apple Inc.）</li><li>Fixed translations for your own terms, per file or for all files</li><li>Formal, neutral or casual tone, plus custom instructions in any language</li></ul>
      </div>${panel('prefs')}</div>`,
  4: `<div class="canvas"><div class="copy">${eyebrow}
        <h1>Several languages <em>in one run</em></h1>
        <p class="sub">Pick the extra languages and get one translated copy per language.</p>
        <ul class="points"><li>10 languages: English, 繁體中文, 简体中文, 日本語, 한국어, Español, Français, Deutsch, Tiếng Việt, ไทย</li><li>Translate only some slides, or just the current sheet tab</li><li>Longer text still fits: fonts shrink, columns widen</li></ul>
      </div>${panel('main')}</div>`,
  5: `<div class="canvas"><div class="copy">${eyebrow}
        <h1>Close the panel, <em>keep working</em></h1>
        <p class="sub">Large files keep translating in the background — you get a notification when the copy is ready.</p>
        <ul class="points"><li>Progress with time left</li><li>Resumes automatically after a browser restart</li><li>Clear, plain-language messages if something needs your attention</li></ul>
      </div>${panel('progress')}</div>`,
  marquee: `<div class="canvas marquee"><div class="copy">${eyebrow}
        <h1>Translate Google <em>Slides, Docs, Sheets &amp; Forms</em></h1>
        <p class="sub">AI translation into 10 languages. Layout kept, original untouched.</p></div>
        <div class="stack">
          ${panel('setup', 'style="left:20px;top:40px;transform:rotate(-4deg)"')}
          ${panel('done', 'style="left:390px;top:20px;transform:rotate(3deg);z-index:2"')}
        </div></div>`,
  tile: `<div class="canvas tile"><img src="../icons/icon128.png" alt=""><h1>Workspace Translator Pro</h1>
        <p class="sub">AI translation · layout preserved</p>
        <div class="chips"><span style="background:#f4b400;color:#202124">Slides</span><span style="background:#4285f4">Docs</span><span style="background:#0f9d58">Sheets</span><span style="background:#7248b9">Forms</span></div></div>`,
};
document.getElementById('root').outerHTML = shots[shot];
</script>
</body>
</html>
