<!DOCTYPE html>
<!-- Chrome Web Store images (not shipped). Rendered by store-assets/build.py:
     compose.html?shot=1..5 → 1280×800 screenshots, ?shot=marquee → 1400×560,
     ?shot=tile → 440×280. The panels are the real popup.html in demo mode.
     Style: light, centred headline, the product rising from the bottom edge. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f5f5f7 55%, #e9e9ee 100%);

    letter-spacing: -0.01em;
  }

  /* ── 1280×800 screenshot template ─────────────────────────────────── */
  .shot { position: relative; width: 100%; height: 100%; text-align: center; }
  .brand { position: absolute; top: 44px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 10px;
           font-size: 17px; font-weight: 600; color: #6e6e73; }

  .grad { background: linear-gradient(90deg, #0071e3, #7d4cdb); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* The product: real panel, rising from the bottom edge */
  .device {
    position: absolute; left: 50%; top: 236px; transform: translateX(-50%);
    width: 404px; height: 620px; padding: 10px; border-radius: 30px;
    background: #1c1c1e;

  .points { position: absolute; top: 330px; width: 300px; list-style: none; display: flex; flex-direction: column; gap: 26px; text-align: left; }

  .doc.right { right: 92px; transform: rotate(3deg); }

  .doc-title { font-size: 19px; font-weight: 700; padding: 6px 14px 10px; }
  .doc-body { padding: 0 14px 14px; font-size: 13px; }

  .fit-tag { display: inline-flex; align-items: center; gap: 6px; margin: 0 14px 14px; padding: 5px 10px; border-radius: 980px;
             font-size: 12px; font-weight: 600; color: #0b7a3b; background: #e6f6ec; }

  .marquee { position: relative; width: 100%; height: 100%; }
  .marquee .copy { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 640px; }
  .marquee .brand { position: static; justify-content: flex-start; margin-bottom: 18px; }

  .marquee .device { left: auto; right: 150px; top: 96px; transform: none; }

  .sub, .points span { text-wrap: balance; }

  /* ── Tile 440×280 ──────────────────────────────────────────────────
     Fixed 440×280 box: headless Chrome's window is wider than 440px, so the
     tile must not depend on the window width to stay centred. */
  .tile {
    position: absolute; left: 0; top: 0; width: 440px; height: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;

  .tile .types span { display: inline-flex; align-items: center; gap: 5px; }

  .tile p { margin-top: 8px; font-size: 13px; color: #6e6e73; }

  .ov { position: relative; width: 100%; height: 100%; text-align: center; }
  .ov .grid { position: absolute; left: 80px; right: 80px; top: 240px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; text-align: left; }
  .card { background: #fff; border-radius: 20px; padding: 26px 26px 24px; box-shadow: 0 18px 44px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04); }
  .card .ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 16px; }

  .card b { display: block; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  .card span { font-size: 15px; color: #6e6e73; line-height: 1.5; text-wrap: balance; }
  .ov .langs { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 7px 14px; border-radius: 980px; font-size: 14px; font-weight: 600; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .chip.t { color: #fff; box-shadow: none; }

  /* ── Dark brand style for marquee and tile ─────────────────────────── */
  .dark { color: #f5f5f7; background:
      radial-gradient(60% 90% at 85% 20%, rgba(125,76,219,.45) 0%, transparent 60%),
      radial-gradient(50% 80% at 10% 100%, rgba(0,113,227,.35) 0%, transparent 60%),
      linear-gradient(135deg, #0b0d16 0%, #141831 100%); }
  .dark .grad2 { background: linear-gradient(90deg, #5eb4ff, #b18cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mq { position: absolute; left: 0; top: 0; width: 1400px; height: 560px; overflow: hidden; }
  .mq .copy { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); width: 620px; }
  .mq .name { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: #c7c7d1; }
  .mq .name img { width: 34px; height: 34px; border-radius: 8px; }
  .mq h1 { margin-top: 18px; font-size: 56px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; }
  .mq ul { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 10px; font-size: 20px; color: #d2d2da; }
  .mq li::before { content: '✓'; color: #6fd39a; font-weight: 700; margin-right: 12px; }
  .slide { position: absolute; width: 400px; height: 225px; border-radius: 14px; background: #fff; color: #1d1d1f; padding: 26px 28px;
           box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); text-align: left; }
  .slide .tag { position: absolute; top: -14px; left: 20px; padding: 5px 12px; border-radius: 980px; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  .slide h3 { font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; }
  .slide h3 em { font-style: normal; color: #1a73e8; }

  .mq .s1 { left: 780px; top: 70px; transform: rotate(-4deg); }
  .mq .s2 { left: 900px; top: 270px; transform: rotate(3deg); }
  .mq .arrow { position: absolute; left: 1148px; top: 222px; font-size: 42px; color: #b18cff; transform: rotate(35deg); }

  .tl { position: absolute; left: 0; top: 0; width: 440px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .tl img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 10px 26px rgba(0,0,0,.45); }
  .tl h1 { margin-top: 14px; font-size: 27px; font-weight: 700; letter-spacing: -0.025em; }
  .tl .types { display: flex; gap: 6px; margin-top: 12px; }
  .tl .types span { padding: 4px 10px; border-radius: 980px; font-size: 13px; font-weight: 700; color: #fff; }
  .tl p { margin-top: 12px; font-size: 14px; color: #c7c7d1; font-weight: 500; }
  .ftypes { display: flex; gap: 14px; margin-top: 30px; }
  .ftype { width: 64px; height: 76px; border-radius: 10px; position: relative; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .ftype::after { content: ''; position: absolute; top: 0; right: 0; width: 18px; height: 18px; border-radius: 0 10px 0 6px; background: rgba(255,255,255,.35); }
  .ftype svg { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  /* Marquee: two mini slides with the same layout, different language */
  .ms { position: absolute; top: 140px; width: 300px; height: 240px; border-radius: 12px; background: #fff; color: #1d1d1f; overflow: hidden;
        box-shadow: 0 28px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); text-align: left; }
  .ms.a { left: 752px; } .ms.b { left: 1080px; }
  .ms .hd { height: 46px; padding: 0 16px; display: flex; align-items: center; font-size: 17px; font-weight: 700; color: #fff; background: #1a3a6b; letter-spacing: -0.01em; }
  .ms .bd { display: grid; grid-template-columns: 1fr 104px; gap: 12px; padding: 14px 16px; }
  .mq .ms ul { list-style: none; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; line-height: 1.35; color: #1d1d1f; }
  .ms li { padding-left: 12px; position: relative; }
  .mq .ms li::before { content: ''; margin: 0; color: transparent; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #1a73e8; }
  .ms em { font-style: normal; color: #1a73e8; font-weight: 700; }
  .ms .chart { display: flex; align-items: flex-end; gap: 6px; height: 104px; padding: 8px; border-radius: 8px; background: #f1f4f9; }
  .ms .chart i { flex: 1; border-radius: 3px 3px 0 0; }
  .ms .ft { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; justify-content: space-between; font-size: 10px; color: #9a9aa2; }
  .ms .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, #4285f4 0 50%, #ea4335 50% 70%, #fbbc04 70%); }
  .ms-lbl { position: absolute; top: 396px; width: 300px; text-align: center; font-size: 15px; font-weight: 600; color: #c7c7d1; }
  .ms-arrow { position: absolute; left: 1058px; top: 246px; width: 20px; text-align: center; font-size: 22px; color: #b18cff; }
  .kept { position: absolute; left: 1196px; top: 102px; padding: 7px 14px; border-radius: 980px; font-size: 14px; font-weight: 700; color: #0b5c2e; background: #c8f2d8; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="root"></div>
<script>

        types: ['簡報', '文件', '試算表', '表單'], tile: 'AI 翻譯 · 10 種語言 · 版面不跑',

      ${device('progress')}</div>`,
  overview: `<div class="shot ov">${head('Everything you need. <span class="grad">Nothing to reformat.</span>',

      <div class="langs"><span class="chip t" style="background:#f4b400">Slides</span><span class="chip t" style="background:#4285f4">Docs</span><span class="chip t" style="background:#0f9d58">Sheets</span><span class="chip t" style="background:#7248b9">Forms</span><span style="width:14px"></span><span class="chip">English</span><span class="chip">繁體中文</span><span class="chip">简体中文</span><span class="chip">日本語</span><span class="chip">한국어</span><span class="chip">Español</span><span class="chip">Français</span><span class="chip">Deutsch</span><span class="chip">Tiếng Việt</span><span class="chip">ไทย</span></div></div>`,
  marquee: (() => { const L = T[lang] || T.en; return `<div class="mq dark" lang="${L.html}"><div class="copy">
        <div class="name"><img src="../icons/icon128.png" alt="">Workspace Translator Pro</div>
        <h1>${L.h1}<br><span class="grad2">${L.h2}</span></h1>
        <ul>${L.pts.map((p) => `<li>${p}</li>`).join('')}</ul>
        <div class="ftypes">
          <div class="ftype" style="background:#f4b400"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M7 10h10"/></svg></div>
          <div class="ftype" style="background:#4285f4"><svg viewBox="0 0 24 24"><path d="M6 6h12M6 10h12M6 14h12M6 18h8"/></svg></div>
          <div class="ftype" style="background:#0f9d58"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M4 14.5h16M10 5v14"/></svg></div>
          <div class="ftype" style="background:#7248b9"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="7" r="1.2"/><circle cx="6.5" cy="12" r="1.2"/><circle cx="6.5" cy="17" r="1.2"/><path d="M10 7h8M10 12h8M10 17h8"/></svg></div>
        </div></div>
      ${mini('a', SRC)}<div class="ms-arrow">→</div>${mini('b', L.slide)}
      <div class="ms-lbl" style="left:752px">English</div><div class="ms-lbl" style="left:1080px">${L.slide.name}</div>
      <div class="kept">✓ ${L.kept}</div></div>`; })(),
  tile: (() => { const L = T[lang] || T.en; return `<div class="tl dark" lang="${L.html}"><img src="../icons/icon128.png" alt=""><h1>Workspace Translator Pro</h1>
        <div class="types">${L.types.map((t, i) => `<span style="background:${['#f4b400', '#4285f4', '#0f9d58', '#7248b9'][i]}">${t}</span>`).join('')}</div>
        <p>${L.tile}</p></div>`; })(),
};
document.getElementById('root').outerHTML = shots[shot];
</script>
