<!DOCTYPE html>
<!-- Chrome Web Store images (not shipped). Rendered by store-assets/build.py:
     compose.html?shot=1..5 → 1280×800 screenshots, ?shot=marquee → 1400×560,
     ?shot=tile → 440×280. The panels are the real popup.html in demo mode.
     Style: light, centred headline, the product rising from the bottom edge. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang TC",
                 "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans", sans-serif;
    color: #1d1d1f;
    background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f5f5f7 55%, #e9e9ee 100%);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ── 1280×800 screenshot template ─────────────────────────────────── */
  .shot { position: relative; width: 100%; height: 100%; text-align: center; }
  .brand { position: absolute; top: 44px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 10px;
           font-size: 17px; font-weight: 600; color: #6e6e73; }
  .brand img { width: 26px; height: 26px; border-radius: 6px; }
  .shot h1 { position: absolute; top: 92px; left: 0; right: 0; font-size: 54px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
  .shot .sub { position: absolute; top: 162px; left: 0; right: 0; font-size: 22px; color: #6e6e73; }
  .grad { background: linear-gradient(90deg, #0071e3, #7d4cdb); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* The product: real panel, rising from the bottom edge */
  .device {
    position: absolute; left: 50%; top: 236px; transform: translateX(-50%);
    width: 404px; height: 620px; padding: 10px; border-radius: 30px;
    background: #1c1c1e;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .device .screen { width: 384px; height: 600px; border-radius: 22px; overflow: hidden; background: #0d0e14; }
  .device iframe { width: 384px; height: 720px; border: 0; display: block; }

  /* Feature points beside the product */
  .points { position: absolute; top: 330px; width: 300px; list-style: none; display: flex; flex-direction: column; gap: 26px; text-align: left; }
  .points.left { left: 80px; }
  .points.right { right: 80px; }
  .points li { display: flex; flex-direction: column; gap: 4px; }
  .points b { font-size: 19px; font-weight: 600; }
  .points span { font-size: 15px; color: #6e6e73; line-height: 1.45; }

  /* Before / after documents (shot 1) */
  .doc { position: absolute; top: 360px; width: 290px; border-radius: 14px; overflow: hidden; background: #fff; text-align: left;
         box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.05); }
  .doc.left { left: 92px; transform: rotate(-3deg); }
  .doc.right { right: 92px; transform: rotate(3deg); }
  .doc-lang { font-size: 12px; font-weight: 600; color: #6e6e73; padding: 10px 14px 0; letter-spacing: 0.04em; text-transform: uppercase; }
  .doc-title { font-size: 19px; font-weight: 700; padding: 6px 14px 10px; }
  .doc-body { padding: 0 14px 14px; font-size: 13px; }
  .doc-body .row { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid #ececf0; }
  .doc-body .row span:last-child { color: #6e6e73; }
  .fit-tag { display: inline-flex; align-items: center; gap: 6px; margin: 0 14px 14px; padding: 5px 10px; border-radius: 980px;
             font-size: 12px; font-weight: 600; color: #0b7a3b; background: #e6f6ec; }
  .fit-tag::before { content: '⤡'; font-size: 13px; }
  .doc.right .doc-title { font-size: 16px; }
  .doc .bar { height: 6px; background: linear-gradient(90deg, #0071e3, #7d4cdb); }

  /* ── Marquee 1400×560 ─────────────────────────────────────────────── */
  .marquee { position: relative; width: 100%; height: 100%; }
  .marquee .copy { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 640px; }
  .marquee .brand { position: static; justify-content: flex-start; margin-bottom: 18px; }
  .marquee h1 { position: static; font-size: 58px; line-height: 1.06; font-weight: 700; letter-spacing: -0.03em; }
  .marquee .sub { position: static; margin-top: 18px; font-size: 22px; color: #6e6e73; }
  .marquee .device { left: auto; right: 150px; top: 96px; transform: none; }

  .sub, .points span { text-wrap: balance; }

  /* ── Tile 440×280 ──────────────────────────────────────────────────
     Fixed 440×280 box: headless Chrome's window is wider than 440px, so the
     tile must not depend on the window width to stay centred. */
  .tile {
    position: absolute; left: 0; top: 0; width: 440px; height: 280px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f5f5f7 60%, #ebebf0 100%);
  }
  .tile img { width: 56px; height: 56px; border-radius: 13px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14); }
  .tile h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin-top: 12px; }
  .tile .types { display: flex; gap: 14px; margin-top: 12px; font-size: 14px; font-weight: 600; color: #1d1d1f; }
  .tile .types span { display: inline-flex; align-items: center; gap: 5px; }
  .tile .types i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tile p { margin-top: 8px; font-size: 13px; color: #6e6e73; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const shot = new URLSearchParams(location.search).get('shot') || '1';
const device = (state, style = '', marks = '') => `
  <div class="device" style="${style}"><div class="screen"><iframe src="../popup.html?demo=${state}&ui=en${marks ? '&marks=' + marks : ''}"></iframe></div></div>`;
const brand = `<div class="brand"><img src="../icons/icon128.png" alt="">Workspace Translator Pro</div>`;
const head = (h1, sub) => `${brand}<h1>${h1}</h1><p class="sub">${sub}</p>`;
const pts = (side, items) => `<ul class="points ${side}">${items.map(([b, s]) => `<li><b>${b}</b><span>${s}</span></li>`).join('')}</ul>`;

const shots = {
  1: `<div class="shot">${head('Translate Google files. <span class="grad">Keep the layout.</span>',
        'Slides, Docs, Sheets and Forms — longer text auto-fits, your original untouched.')}
      <div class="doc left"><div class="bar"></div><div class="doc-lang">Original · English</div><div class="doc-title">Q3 Product Roadmap</div>
        <div class="doc-body"><div class="row"><span>Launch beta</span><span>Sep 14</span></div><div class="row"><span>Customer pilots</span><span>Oct 1</span></div><div class="row"><span>General availability</span><span>Jan 31</span></div></div></div>
      <div class="doc right"><div class="bar"></div><div class="doc-lang">Copy · 日本語</div><div class="doc-title">第3四半期 製品ロードマップ</div>
        <div class="doc-body"><div class="row"><span>ベータ版の公開</span><span>9月14日</span></div><div class="row"><span>顧客パイロット</span><span>10月1日</span></div><div class="row"><span>一般提供開始</span><span>1月31日</span></div></div>
        <div class="fit-tag">Longer text auto-fitted · 6 text boxes</div></div>
      ${device('done', '', 'done')}</div>`,
  2: `<div class="shot">${head('Set up in a minute. <span class="grad">Free.</span>',
        'Get a free Gemini key — no credit card. Pasted, checked and saved automatically.')}
      ${pts('left', [['Free Gemini key', 'Natural, fluent AI translation at no cost to start.'], ['Or bring your own', 'OpenAI, Claude or any OpenAI-compatible endpoint.']])}
      ${pts('right', [['Checked for you', 'The key is tested the moment you paste it.'], ['Stays in your browser', 'Your key is sent only to the provider you chose.']])}
      ${device('setup-done')}</div>`,
  3: `<div class="shot">${head('Your names. Your terms. <span class="grad">Your tone.</span>',
        'Tell it once how to handle names — the AI recognises them by itself.')}
      ${pts('left', [['People, brands, places', 'Translate, keep the original, or both: Nintendo (任天堂).'], ['Fixed terms', 'Your own words, the same way every time.']])}
      ${pts('right', [['Tone', 'Keep the original, or go formal, neutral or casual.'], ['Any language', 'Write extra instructions in your own language.']])}
      ${device('prefs')}</div>`,
  4: `<div class="shot">${head('Many languages. <span class="grad">One click.</span>',
        'Pick extra languages and get a translated copy for each.')}
      ${pts('left', [['10 languages', 'English, 繁體中文, 简体中文, 日本語, 한국어, Español, Français, Deutsch, Tiếng Việt, ไทย.'], ['Just what you need', 'Only some slides, or only the current sheet.']])}
      ${pts('right', [['Fits the layout', 'Longer text shrinks to fit; columns widen.'], ['Office files too', '.pptx, .docx and .xlsx opened from Drive.']])}
      ${device('main')}</div>`,
  5: `<div class="shot">${head('Close the panel. <span class="grad">Keep working.</span>',
        'Big files keep translating in the background — you get a notification when it’s done.')}
      ${pts('left', [['Time left', 'See the progress and how long it will take.'], ['Resumes', 'Picks up again after a browser restart.']])}
      ${pts('right', [['Notified', 'A notification the moment your copy is ready.'], ['Clear messages', 'Plain language if something needs you.']])}
      ${device('progress')}</div>`,
  marquee: `<div class="marquee"><div class="copy">${brand}
        <h1>Translate Google files.<br><span class="grad">Keep the layout.</span></h1>
        <p class="sub">Slides, Docs, Sheets and Forms in 10 languages — your original untouched.</p></div>
      ${device('done')}</div>`,
  tile: `<div class="tile"><img src="../icons/icon128.png" alt=""><h1>Workspace Translator Pro</h1>
        <div class="types"><span><i style="background:#f4b400"></i>Slides</span><span><i style="background:#4285f4"></i>Docs</span><span><i style="background:#0f9d58"></i>Sheets</span><span><i style="background:#7248b9"></i>Forms</span></div>
        <p>AI translation into 10 languages · layout kept</p></div>`,
};
document.getElementById('root').outerHTML = shots[shot];
</script>
</body>
</html>
